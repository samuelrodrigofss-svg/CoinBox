name: Inspecionar Conteudo do Novo App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    # Esse passo vai listar a árvore de arquivos de dentro do seu ZIP no log
    - name: Listar arquivos dentro do ZIP
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Nenhum arquivo .zip encontrado!"
          exit 1
        fi
        echo "=== LISTANDO ARQUIVOS DO ZIP: $ZIP_FILE ==="
        unzip -l "$ZIP_FILE" | head -n 50
