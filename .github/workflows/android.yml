name: Compilar APK React Vite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o seu repositório onde está o arquivo ZIP
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    # 2. Extrai o ZIP garantindo que tudo fique na raiz
    - name: Extrair Projeto Corretamente
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Nenhum arquivo .zip encontrado no repositório!"
          exit 1
        fi
        echo "Extraindo projeto: $ZIP_FILE"
        mkdir -p extracted_project
        unzip -o "$ZIP_FILE" -d ./extracted_project
        
        if [ -f "./extracted_project/package.json" ]; then
          cp -r ./extracted_project/. .
        else
          SUB_PKG=$(find ./extracted_project -name "package.json" | head -n 1)
          if [ -n "$SUB_PKG" ]; then
            ROOT_PROJECT_DIR=$(dirname "$SUB_PKG")
            cp -r "$ROOT_PROJECT_DIR"/. .
          else
            cp -r ./extracted_project/* . 2>/dev/null || true
          fi
        fi
        rm -rf ./extracted_project
        touch .env.example .env

    # 3. Configura o Node.js para rodar os comandos do Vite e do Capacitor
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 4. Instala as dependências e adiciona o Capacitor para gerar o Android real
    - name: Instalar Dependências e Ferramentas de App
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps

    # 5. Compila o site em React/Vite (Gera a pasta 'dist')
    - name: Compilar Código de Interface (Vite Build)
      run: npm run build --if-present

    # 6. CORREÇÃO: Cria o arquivo capacitor.config.json direto para evitar o erro do CommonJS/TypeScript
    - name: Inicializar e Sincronizar Plataforma Android
      run: |
        mkdir -p dist
        if [ ! -f "dist/index.html" ] && [ -f "index.html" ]; then
          cp -r index.html src assets dist/ 2>/dev/null || cp -r * dist/ 2>/dev/null || true
        fi
        
        # Remove pastas antigas ou falsas que possam dar conflito
        rm -rf android
        rm -f capacitor.config.ts
        rm -f capacitor.config.js
        
        # Cria a configuração em formato JSON nativo direto na raiz
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.samuel.coinbox",
          "appName": "CoinBox",
          "webDir": "dist",
          "bundledWebRuntime": false
        }
        EOF
        
        # Executa a geração oficial do projeto Android estruturado baseado no JSON
        npx cap add android
        npx cap sync android

    # 7. Configura o Java necessário para compilar o projeto gerado
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 8. Cria a chave de segurança obrigatória para assinar o novo pacote
    - name: Gerar Chave de Assinatura (debug.keystore)
      run: |
        mkdir -p android/app
        keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # 9. Configura limites de RAM para o Gradle do Capacitor
    - name: Configurar Limites de Memória do Gradle
      run: |
        echo "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC" >> android/gradle.properties
        echo "org.gradle.daemon=false" >> android/gradle.properties

    # 10. Configura os repositórios da Google para as ferramentas do Capacitor
    - name: Criar Script de Inicialização Global (init.gradle)
      run: |
        cat << 'EOF' > init.gradle
        settingsEvaluated { settings ->
            settings.pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            settings.dependencyResolutionManagement {
                repositories {
                    google()
                    mavenCentral()
                }
            }
        }
        EOF

    # 11. Configura a versão recomendada do Gradle para projetos do Capacitor
    - name: Configurar e Validar Gradle Oficial
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # 12. Compila o APK usando a nova pasta android gerada com sucesso
    - name: Compilar APK Final CoinBox
      run: |
        cd android
        chmod +x gradlew 2>/dev/null || true
        gradle assembleDebug --init-script ../init.gradle -Djava.awt.headless=true

    # 13. Envia o APK gerado para a aba de Downloads
    - name: Enviar APK para download
      uses: actions/upload-artifact@v4
      with:
        name: CoinBox-Instalavel
        path: |
          **/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/debug/*.apk
